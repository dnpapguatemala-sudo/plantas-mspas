<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Plantas Medicinales MSPAS</title>
<style>
*{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
body{font-family:system-ui,-apple-system,sans-serif;background:#F2F7F0;min-height:100vh}
.hdr{background:#1F3864}
.hdr-top{display:flex;align-items:center;gap:10px;padding:13px 14px 9px}
.logo{width:38px;height:38px;min-width:38px;background:#27500A;border-radius:50%;display:flex;align-items:center;justify-content:center;border:2px solid #C0DD97;font-size:19px}
.hdr-title{font-size:14px;font-weight:700;color:#fff;line-height:1.2}
.hdr-sub{font-size:10px;color:#97C459;margin-top:1px}
.swrap{padding:0 14px 12px}
.sbox{display:flex;align-items:center;border-radius:22px;border:2px solid #27500A;background:#fff;box-shadow:0 0 0 3px #97C45940}
.si{padding:0 8px 0 12px;font-size:16px;color:#27500A}
.sbox input{flex:1;border:none;outline:none;font-size:13px;color:#173404;padding:9px 4px;background:transparent}
.sbox input::placeholder{color:#97C459}
.sclr{padding:0 12px;color:#97C459;font-size:16px;cursor:pointer;display:none}
.frow{padding:0 14px 10px;display:flex;gap:5px;overflow-x:auto;scrollbar-width:none;-ms-overflow-style:none}
.frow::-webkit-scrollbar{display:none}
.fb{flex-shrink:0;padding:4px 11px;border-radius:18px;border:1.5px solid #27500A;background:#fff;color:#27500A;font-size:10px;font-weight:700;cursor:pointer;white-space:nowrap;transition:all .15s}
.fb.on{background:#27500A;color:#C0DD97}
.cbar{padding:2px 14px 8px;font-size:11px;color:#639922;font-weight:600}
.grid{padding:0 10px 90px;display:grid;grid-template-columns:repeat(2,1fr);gap:9px}
@media(min-width:480px){.grid{grid-template-columns:repeat(3,1fr)}}
@media(min-width:768px){.grid{grid-template-columns:repeat(4,1fr);padding:0 16px 80px}}
@media(min-width:1024px){.grid{grid-template-columns:repeat(5,1fr)}}
.card{border-radius:13px;overflow:hidden;border:1px solid #C0DD97;background:#fff;cursor:pointer;transition:transform .15s,border-color .15s;display:flex;flex-direction:column}
.card:hover{transform:translateY(-2px);border-color:#3B6D11}
.card:active{transform:scale(.97)}
.cimg{width:100%;aspect-ratio:1/1;position:relative;overflow:hidden;display:flex;align-items:center;justify-content:center}
.cimg img{width:100%;height:100%;object-fit:cover;display:block}
.cph{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px}
.cph i{font-size:34px}
.cph span{font-size:9px}
.ficha-badge{position:absolute;bottom:6px;right:6px;background:#27500A;color:#C0DD97;font-size:8px;font-weight:700;padding:2px 7px;border-radius:8px;display:flex;align-items:center;gap:3px}
.cbody{padding:8px 10px 10px;flex:1;display:flex;flex-direction:column}
.cnum{font-size:8px;color:#639922;font-weight:700}
.cname{font-size:12px;font-weight:700;color:#173404;line-height:1.25;margin-bottom:1px}
.csci{font-size:8px;color:#3B6D11;font-style:italic;margin-bottom:5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.ctags{display:flex;flex-wrap:wrap;gap:3px;margin-bottom:6px}
.ptag{font-size:7px;padding:2px 5px;border-radius:8px;font-weight:700;white-space:nowrap}
.clink{display:inline-flex;align-items:center;gap:2px;font-size:8px;color:#1F3864;border:1px solid #1F3864;border-radius:8px;padding:2px 6px;text-decoration:none;font-weight:700;margin-top:auto;width:fit-content}

/* LIGHTBOX */
.lb{display:none;position:fixed;inset:0;z-index:400;background:rgba(0,0,0,.92);flex-direction:column}
.lb.open{display:flex}
.lb-bar{flex-shrink:0;display:flex;align-items:center;justify-content:space-between;padding:10px 14px;background:rgba(0,0,0,.6);gap:10px}
.lb-back{display:flex;align-items:center;gap:6px;background:#27500A;border:none;color:#C0DD97;font-size:12px;font-weight:700;padding:7px 13px;border-radius:20px;cursor:pointer;flex-shrink:0;white-space:nowrap}
.lb-info{flex:1;min-width:0}
.lb-num{font-size:10px;color:#97C459;font-weight:700}
.lb-name{font-size:15px;font-weight:700;color:#fff;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.lb-sci{font-size:11px;color:#C0DD97;font-style:italic}
.lb-close{background:rgba(255,255,255,.15);border:none;color:#fff;width:34px;height:34px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:18px;flex-shrink:0}

/* ZOOM BAR */
.zoom-bar{flex-shrink:0;display:flex;align-items:center;justify-content:center;gap:8px;padding:7px 14px;background:rgba(0,0,0,.5)}
.zbtn{background:rgba(255,255,255,.2);border:none;color:#fff;font-size:20px;font-weight:700;width:38px;height:38px;border-radius:50%;cursor:pointer;display:flex;align-items:center;justify-content:center;transition:background .15s;line-height:1}
.zbtn:hover,.zbtn:active{background:rgba(255,255,255,.4)}
.zlabel{font-size:12px;color:#C0DD97;min-width:44px;text-align:center;font-weight:700}
.zreset{background:rgba(255,255,255,.15);border:none;color:#C0DD97;font-size:11px;font-weight:700;padding:0 12px;height:32px;border-radius:16px;cursor:pointer;white-space:nowrap}
.zreset:hover{background:rgba(255,255,255,.3)}

/* IMAGE WRAP — permite scroll cuando hay zoom */
.lb-img-wrap{flex:1;overflow:auto;display:flex;align-items:flex-start;justify-content:center;padding:10px;-webkit-overflow-scrolling:touch;touch-action:pinch-zoom pan-x pan-y}
.lb-img-wrap img{display:block;border-radius:10px;transform-origin:top center;transition:transform .2s ease;cursor:zoom-in;max-width:100%;height:auto}

.lb-placeholder{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:16px;color:#fff}
.lb-placeholder i{font-size:60px;color:#639922}
.lb-placeholder p{font-size:14px;color:#97C459;text-align:center;padding:0 24px;line-height:1.6}
.lb-foot{flex-shrink:0;padding:10px 14px;background:rgba(0,0,0,.6);display:flex;gap:8px;flex-wrap:wrap}
.lbtn{flex:1;min-width:0;display:flex;align-items:center;justify-content:center;gap:6px;font-size:11px;font-weight:700;padding:10px 8px;border-radius:10px;text-decoration:none;border:none;cursor:pointer;white-space:nowrap}
.lbtn-norm{background:#1F3864;color:#fff}
.lbtn-wa{background:#25D366;color:#fff}
.lbtn-mail{background:#fff;color:#1F3864}
.lbtn-dl{background:#27500A;color:#C0DD97}
.lb-volver{padding:0 14px 12px;background:rgba(0,0,0,.6)}
.lb-volver button{width:100%;display:flex;align-items:center;justify-content:center;gap:8px;background:rgba(255,255,255,.1);border:1.5px solid rgba(255,255,255,.25);color:#fff;font-size:13px;font-weight:700;padding:11px;border-radius:12px;cursor:pointer}
</style>
</head>
<body>

<div class="hdr">
  <div class="hdr-top">
    <div class="logo">🌿</div>
    <div>
      <div class="hdr-title">Plantas Medicinales MSPAS</div>
      <div class="hdr-sub">Normativa NCPMICC · Módulo 8 · Guatemala</div>
    </div>
  </div>
  <div class="swrap">
    <div class="sbox">
      <i class="ti ti-search si" aria-hidden="true"></i>
      <input type="text" id="srch" placeholder="Buscar planta o nombre científico…" oninput="onSrch(this.value)">
      <span class="sclr" id="clr" onclick="clrSrch()"><i class="ti ti-x" aria-hidden="true"></i></span>
    </div>
  </div>
  <div class="frow" id="frow"></div>
</div>
<div class="cbar" id="cbar"></div>
<div class="grid" id="grid"></div>

<!-- LIGHTBOX -->
<div class="lb" id="lb">
  <!-- Barra superior -->
  <div class="lb-bar">
    <button class="lb-back" onclick="closeLb()">← Menú</button>
    <div class="lb-info">
      <div class="lb-num" id="lbNum"></div>
      <div class="lb-name" id="lbName"></div>
      <div class="lb-sci" id="lbSci"></div>
    </div>
    <button class="lb-close" onclick="closeLb()">✕</button>
  </div>

  <!-- Barra de zoom -->
  <div class="zoom-bar">
    <button class="zbtn" onclick="changeZoom(-0.25)" aria-label="Alejar">−</button>
    <span class="zlabel" id="zlabel">100%</span>
    <button class="zbtn" onclick="changeZoom(0.25)" aria-label="Acercar">+</button>
    <button class="zreset" onclick="resetZoom()">↺ Reset</button>
  </div>

  <!-- Imagen -->
  <div class="lb-img-wrap" id="lbImgWrap"></div>

  <!-- Botones compartir -->
  <div class="lb-foot" id="lbFoot"></div>

  <!-- Volver -->
  <div class="lb-volver">
    <button onclick="closeLb()">← Volver al menú de plantas</button>
  </div>
</div>

{no:"28",n:"Llantén",s:"Plantago major",o:"Cola de Ardilla, Lanten, Ractzi",c:["Digestivo","Urinario","Respiratorio","Piel"],pg:118,img:"llanten.jpg",ficha:"ficha-llanten.png"},

{no:"43",n:"Valeriana",s:"Valeriana officinalis",o:"Raíz de gato, Uxe´ulew",c:["Nervioso","Cardiovascular"],pg:125,img:"valeriana.jpg",ficha:"ficha-valeriana.jpg"},
{no:"44",n:"Verbena",s:"Verbena carolina",o:"Chachalbe, Chichavac, Cotacám, Verbena fina",c:["Digestivo","Respiratorio","Ginecológico"],pg:125,img:"verbena.jpg",ficha:"ficha-verbena.png"},
];

let af="Todas";
let zoomLevel=1;

function pdfHref(pg){return`atencion-a-la-demanda-modulo-8-mspas.pdf#page=${pg}`;}
function waHref(p){return`https://wa.me/?text=${encodeURIComponent('🌿 *'+p.n+'* ('+p.s+')\nNCPMICC-'+p.no+' — Normativa MSPAS Guatemala\n\nPlanta medicinal registrada en la Normativa de Atención Integral MSPAS, Módulo 8, página '+p.pg+'.')}`;}
function mailHref(p){return`mailto:?subject=${encodeURIComponent('Planta medicinal: '+p.n+' — MSPAS')}&body=${encodeURIComponent('🌿 '+p.n+' ('+p.s+')\nNCPMICC-'+p.no+' — Normativa MSPAS Guatemala\n\nPlanta medicinal registrada en la Normativa de Atención Integral MSPAS, Módulo 8, página '+p.pg+'.')}`;}

// ── ZOOM ──
function changeZoom(delta){
  zoomLevel=Math.min(4, Math.max(0.5, zoomLevel+delta));
  applyZoom();
}
function resetZoom(){
  zoomLevel=1;
  applyZoom();
}
function applyZoom(){
  const img=document.querySelector('#lbImgWrap img');
  if(!img) return;
  img.style.transform=`scale(${zoomLevel})`;
  img.style.transformOrigin='top center';
  img.style.cursor=zoomLevel>1?'zoom-out':'zoom-in';
  document.getElementById('zlabel').textContent=Math.round(zoomLevel*100)+'%';
}

function filt(){
  const q=document.getElementById('srch').value.toLowerCase();
  return P.filter(p=>{
    const mc=af==="Todas"||p.c.includes(af);
    const mq=!q||p.n.toLowerCase().includes(q)||p.s.toLowerCase().includes(q)||(p.o&&p.o.toLowerCase().includes(q));
    return mc&&mq;
  });
}
function rFilters(){
  document.getElementById('frow').innerHTML=["Todas",...Object.keys(C)].map(c=>`<button class="fb${c===af?' on':''}" onclick="setF('${c}')">${c}</button>`).join('');
}
function setF(f){af=f;rFilters();render();}
function onSrch(v){document.getElementById('clr').style.display=v?'block':'none';render();}
function clrSrch(){document.getElementById('srch').value='';document.getElementById('clr').style.display='none';render();}

function render(){
  const list=filt();
  document.getElementById('cbar').textContent=`  ${list.length} de ${P.length} plantas`;
  document.getElementById('grid').innerHTML=list.map(p=>{
    const pi=P.findIndex(x=>x.no===p.no);
    const bg=p.c[0]&&C[p.c[0]]?C[p.c[0]][0]:"#EAF3DE";
    const fg=p.c[0]&&C[p.c[0]]?C[p.c[0]][1]:"#27500A";
    const em=EM[pi%8];
    const tags=p.c.slice(0,2).map(c=>{const[b,f]=C[c]||["#eee","#555"];return`<span class="ptag" style="background:${b};color:${f}">${c}</span>`;}).join('');
    return`<div class="card" onclick="openLb('${p.no}')">
      <div class="cimg" style="background:${bg}">
        ${p.img?`<img src="${encodeURI(p.img)}" alt="${p.n}" onerror="this.style.display='none';this.nextSibling.style.display='flex'">`:``}
        <div class="cph" ${p.img?'style="display:none"':''}>
          <i class="ti ${em}" aria-hidden="true" style="font-size:34px;color:${fg}"></i>
          <span style="color:${fg}">próximamente</span>
        </div>
        ${p.ficha?`<div class="ficha-badge"><i class="ti ti-file-description" aria-hidden="true"></i>Ficha</div>`:''}
      </div>
      <div class="cbody">
        <div class="cnum">NCPMICC-${p.no}</div>
        <div class="cname">${p.n}</div>
        <div class="csci">${p.s}</div>
        <div class="ctags">${tags}</div>
        <a class="clink" href="${pdfHref(p.pg)}" target="_blank" onclick="event.stopPropagation()">
          <i class="ti ti-file-type-pdf" aria-hidden="true"></i>Normativa p.${p.pg}
        </a>
      </div>
    </div>`;
  }).join('');
}

function openLb(no){
  const p=P.find(x=>x.no===no);if(!p)return;
  const pi=P.findIndex(x=>x.no===no);
  const em=EM[pi%8];

  // Reset zoom
  zoomLevel=1;
  document.getElementById('zlabel').textContent='100%';

  document.getElementById('lbNum').textContent=`NCPMICC-${p.no}`;
  document.getElementById('lbName').textContent=p.n;
  document.getElementById('lbSci').textContent=p.s;

  const wrap=document.getElementById('lbImgWrap');
  if(p.ficha){
    wrap.innerHTML=`<img src="${encodeURI(p.ficha)}" alt="Ficha ${p.n}" style="transform:scale(1);transform-origin:top center;cursor:zoom-in" onerror="this.parentNode.innerHTML=noFichaHtml('${em}')">`;
  } else {
    wrap.innerHTML=noFichaHtml(em);
  }

  document.getElementById('lbFoot').innerHTML=`
    <a class="lbtn lbtn-norm" href="${pdfHref(p.pg)}" target="_blank">
      <i class="ti ti-file-type-pdf" aria-hidden="true" style="font-size:15px"></i>Normativa p.${p.pg}
    </a>
    <a class="lbtn lbtn-wa" href="${waHref(p)}" target="_blank">
      <i class="ti ti-brand-whatsapp" aria-hidden="true" style="font-size:15px"></i>WhatsApp
    </a>
    <a class="lbtn lbtn-mail" href="${mailHref(p)}">
      <i class="ti ti-mail" aria-hidden="true" style="font-size:15px"></i>Correo
    </a>
    ${p.ficha?`<a class="lbtn lbtn-dl" href="${encodeURI(p.ficha)}" download="${p.n}.jpg">
      <i class="ti ti-download" aria-hidden="true" style="font-size:15px"></i>Guardar
    </a>`:''}
  `;

  document.getElementById('lb').classList.add('open');
  document.body.style.overflow='hidden';
}

function noFichaHtml(em){
  return`<div class="lb-placeholder">
    <i class="ti ${em}" aria-hidden="true"></i>
    <p>Ficha no disponible aún.<br><span style="font-size:12px;color:#639922">Agrega el archivo <strong>ficha-[planta].jpg</strong> a tu repositorio.</span></p>
  </div>`;
}

function closeLb(){
  document.getElementById('lb').classList.remove('open');
  document.body.style.overflow='';
  resetZoom();
}

document.addEventListener('keydown',e=>{
  if(e.key==='Escape') closeLb();
  if(e.key==='+') changeZoom(0.25);
  if(e.key==='-') changeZoom(-0.25);
});

rFilters();
render();
</script>
</body>
</html>
